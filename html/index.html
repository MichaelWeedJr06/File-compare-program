<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Compare Program</title>
    <style>
      #output {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <form id="linkForm">
        <label for="Link-1">Link 1:</label>
        <input name="link1" type="text" id="Link-1" />
        <label for="Link-2">Link 2:</label>
        <input name="link2" type="text" id="Link-2" />
        <button type="submit">Submit</button>
      </form>
      <div id="output">
        <div id="leftdata">1</div>
        <div id="rightdata">2</div>
      </div>
    </div>
    <script>
      const theForm = document.getElementById("linkForm");
      theForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        form = e.target;

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        for (let [key, value] of formData) {
          console.log(`${key}: ${value}`);
        }
        try {
          const response = await fetch("/submit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });
          const resData = await response.json();
          document.getElementById("leftdata").innerHTML = resData[0];
          document.getElementById("rightdata").innerHTML = resData[1];
        } catch (err) {
          console.error(err);
        }
      });
    </script>
  </body>
</html>
